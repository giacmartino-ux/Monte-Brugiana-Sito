<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editor Monte Brugiana</title><link rel="stylesheet" href="/editor.css"><script defer src="/editor.js"></script></head><body><header><strong>In disparte · Editor</strong><select id="page" aria-label="Pagina"></select><button id="newPage">Nuova pagina</button><button id="undo">Annulla</button><button id="redo">Ripeti</button><button id="preview">Anteprima</button><button id="check">Verifica</button><button id="publish" class="primary">Pubblica</button><form action="/editor" method="post" id="logout-form" hidden></form></header><div id="status" role="status">Caricamento…</div><main><section><iframe id="canvas" title="Pagina modificabile" sandbox="allow-same-origin"></iframe></section><aside><h2>Modifica elemento</h2><p>Tocca un testo, una fotografia o un collegamento nella pagina.</p><div id="selection"></div><hr><h2>Aggiungi contenuti</h2><select id="kind"><option value="text">Titolo e testo</option><option value="photo">Foto e commento</option><option value="card">Riquadro con pulsante</option></select><select id="position"><option value="after">Dopo il riquadro selezionato</option><option value="before">Prima del riquadro selezionato</option><option value="end">In fondo</option></select><button id="add">Inserisci riquadro</button><hr><button id="export">Esporta bozza</button><button id="import">Importa bozza</button><input id="importFile" type="file" accept=".json" hidden><button id="backups">Ripristina versione</button><button id="reset">Riparti dal sito online</button></aside></main><dialog id="dialog"><div id="report"></div><button id="close">Chiudi</button></dialog></body></html>
